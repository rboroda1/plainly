[package]
name = "plainly"
version = "0.1.0"
edition = "2021"
description = "Explain any software engineering concept in plain language - without losing accuracy."
license = "MIT"
repository = "https://github.com/rboroda1/plainly"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
owo-colors = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
textwrap = "0.16"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
